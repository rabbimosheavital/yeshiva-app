<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הישיבה הקדושה</title>
    <!-- פונט יוקרתי מתאים לאווירה חסידית -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* עיצוב חסידי מפואר - ערכת היכל המלכות (כחול וזהב) */
        :root {
            --bg-primary: #0a192f;
            --bg-secondary: #172a45;
            --gold-royal: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #f8f9fa;
            --text-muted: #a8b2d1;
        }

        body {
            font-family: 'Tinos', serif;
            background-color: var(--bg-primary);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* רצועת כותרות מקודשות עליונה */
        .holy-header {
            background: linear-gradient(135deg, #020c1b, #0a192f);
            border-bottom: 2px solid var(--gold-royal);
            text-align: center;
            padding: 15px 10px;
            position: relative;
        }

        .bsd {
            font-size: 14px;
            color: var(--gold-light);
            letter-spacing: 2px;
            margin: 0 0 5px 0;
        }

        .pasuk {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold-royal);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            margin: 0;
        }

        /* מכולה ראשית */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* כרטיסי לוחות מעוצבים */
        .board-card {
            background-color: var(--bg-secondary);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .board-title {
            color: var(--gold-royal);
            font-size: 22px;
            border-bottom: 1px solid var(--gold-royal);
            padding-bottom: 8px;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(168, 178, 209, 0.1);
        }

        .time-row:last-child {
            border-bottom: none;
        }

        .time-val {
            color: var(--gold-light);
            font-weight: bold;
        }

        /* סגנון פלייר שבועי */
        .flyer-img {
            width: 100%;
            border-radius: 6px;
            border: 1px solid var(--gold-royal);
            cursor: pointer;
        }

        /* כפתורי מערכת ושפה */
        .system-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: var(--bg-secondary);
            padding: 10px;
            border-radius: 6px;
        }

        .lang-btn, .action-btn {
            background: none;
            border: 1px solid var(--gold-royal);
            color: var(--gold-light);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Tinos', serif;
        }

        .lang-btn:hover, .action-btn:hover {
            background-color: var(--gold-royal);
            color: var(--bg-primary);
        }

        /* תחתית הנצחה קבועה */
        .footer-dedication {
            text-align: center;
            border-top: 1px solid var(--gold-royal);
            padding: 20px 10px;
            margin-top: 50px;
            color: var(--gold-light);
            font-size: 16px;
            background-color: #020c1b;
        }
    </style>
</head>
<body>

    <!-- חלק עליון מקודש -->
    <div class="holy-header">
        <div class="bsd">בסייעתא דשמיא</div>
        <div class="pasuk">לַה' הָאָרֶץ וּמְלוֹאָהּ תֵּבֵל וְיֹשְׁבֵי בָהּ</div>
    </div>

    <div class="container">
        <!-- סרגל כלים עליון ושפות -->
        <div class="system-bar">
            <div>
                <button class="lang-btn">🇮🇱 עברית</button>
                <button class="lang-btn">🇺🇸 English</button>
                <button class="lang-btn">🇪🇸 Español</button>
            </div>
            <button class="action-btn" onclick="alert('קופת צדקה ושותפות בינלאומית תיפתח כאן')">🪙 צדקה ושותפות</button>
        </div>

        <div id="app-content">
            <h3 style="text-align: center; color: var(--text-muted);">בס"ד, המערכת טוענת את הנתונים המעודכנים מלוח הניהול...</h3>
        </div>
    </div>

    <!-- תחתית הנצחה קבועה -->
    <div class="footer-dedication" id="footer-dedication">
        אתר ואפליקציה זו נתקבלו כתרומת קודש לעילוי נשמת נפטרים ולבריאות והצלחת משפחות התומכים.
    </div>

    <script>
        // חיבור ישיר למנוע הגוגל שיטס של הישיבה שלכם
        const GOOGLE_SCRIPT_URL = "https://google.com";

        // פונקציה לשאיבת הנתונים הדינמיים והצגתם לקהל
        async function loadData() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getData', password: 'קוד מנכ"ל' }) // הרשאת מנכ"ל ראשונית להצגת המערכת בבדיקה
                });
                const result = await response.json();
                if(result.success) {
                    renderApp(result);
                }
            } catch(e) {
                console.error("שגיאה בטעינת הנתונים", e);
            }
        }

        function renderApp(data) {
            let html = "";
            
            // 1. הצגת פלייר שבועי אם הוא פעיל
            const flyer = data.zmanim.find(r => r[0] === "1. פלייר");
            if (flyer && flyer[4] === "פעיל") {
                html += `
                    <div class="board-card">
                        <div class="board-title">🖼️ לוח זמנים שבועי מעוצב</div>
                        <img src="${flyer[3]}" class="flyer-img" onclick="window.open(this.src)">
                    </div>
                `;
            }

            // 2. הצגת זמני שבת
            const zmanimShabbat = data.zmanim.filter(r => r[0] === "2. שבת" && r[4] === "פעיל");
            if(zmanimShabbat.length > 0) {
                html += `<div class="board-card"><div class="board-title">🕯️ זמני שבת קודש</div>`;
                zmanimShabbat.forEach(r => {
                    html += `<div class="time-row"><span>${r[1]}</span><span class="time-val">${r[2]} (${r[3]})</span></div>`;
                });
                html += `</div>`;
            }

            // 3. הצגת זמני חול
            const zmanimChol = data.zmanim.filter(r => r[0] === "4. חול" && r[4] === "פעיל");
            if(zmanimChol.length > 0) {
                html += `<div class="board-card"><div class="board-title">🌤️ זמני ימי החול</div>`;
                zmanimChol.forEach(r => {
                    html += `<div class="time-row"><span>${r[1]}</span><span class="time-val">${r[2]} (${r[3]})</span></div>`;
                });
                html += `</div>`;
            }

            // 4. הצגת הלכה יומית
            const halacha = data.messages.find(r => r[0] === "5. הלכה יומית" && r[3] === "פעיל");
            if(halacha) {
                html += `
                    <div class="board-card">
                        <div class="board-title">📖 הלכה יומית מהיכל הישיבה</div>
                        <p style="font-size: 18px; line-height: 1.6; color: var(--gold-light);">${halacha[1]}</p>
                    </div>
                `;
            }

            document.getElementById('app-content').innerHTML = html;

            // עדכון הקדשה קבועה בתחתית לפי האקסל שלכם
            const dedType = data.security.find(r => r[0] === "סוג הקדשת האתר");
            const dedNames = data.security.find(r => r[0] === "שמות להקדשת האתר");
            if(dedType && dedNames) {
                document.getElementById('footer-dedication').innerText = `אתר ואפליקציה זו נתקבלו כתרומת קודש ${dedType[1]}: ${dedNames[1]}`;
            }
        }

        // הפעלה בטעינת הדף
        window.onload = loadData;
    </script>
</body>
</html>
