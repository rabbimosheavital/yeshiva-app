<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הישיבה הקדושה</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a192f;
            --bg-secondary: #172a45;
            --gold-royal: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #f8f9fa;
            --text-muted: #a8b2d1;
        }
        body {
            font-family: 'Tinos', serif;
            background-color: var(--bg-primary);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .holy-header {
            background: linear-gradient(135deg, #020c1b, #0a192f);
            border-bottom: 2px solid var(--gold-royal);
            text-align: center;
            padding: 15px 10px;
        }
        .bsd {
            font-size: 14px;
            color: var(--gold-light);
            letter-spacing: 2px;
            margin: 0 0 5px 0;
        }
        .pasuk {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold-royal);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .board-card {
            background-color: var(--bg-secondary);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .board-title {
            color: var(--gold-royal);
            font-size: 22px;
            border-bottom: 1px solid var(--gold-royal);
            padding-bottom: 8px;
            margin-top: 0;
        }
        .time-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(168, 178, 209, 0.1);
        }
        .time-row:last-child {
            border-bottom: none;
        }
        .time-val {
            color: var(--gold-light);
            font-weight: bold;
        }
        .flyer-img {
            width: 100%;
            border-radius: 6px;
            border: 1px solid var(--gold-royal);
            cursor: pointer;
        }
        .system-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: var(--bg-secondary);
            padding: 10px;
            border-radius: 6px;
        }
        .lang-btn, .action-btn {
            background: none;
            border: 1px solid var(--gold-royal);
            color: var(--gold-light);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Tinos', serif;
        }
        .footer-dedication {
            text-align: center;
            border-top: 1px solid var(--gold-royal);
            padding: 20px 10px;
            margin-top: 50px;
            color: var(--gold-light);
            font-size: 16px;
            background-color: #020c1b;
        }
    </style>
</head>
<body>

    <div class="holy-header">
        <div class="bsd">בסייעתא דשמיא</div>
        <div class="pasuk">לַה' הָאָרֶץ וּמְלוֹאָהּ תֵּבֵל וְיֹשְׁבֵי בָהּ</div>
    </div>

    <div class="container">
        <div class="system-bar">
            <div>
                <button class="lang-btn">🇮🇱 עברית</button>
                <button class="lang-btn">🇺🇸 English</button>
                <button class="lang-btn">🇪🇸 Español</button>
            </div>
            <button class="action-btn" onclick="alert('קופת צדקה ושותפות בינלאומית תיפתח כאן')">🪙 צדקה ושותפות</button>
        </div>

        <div id="app-content">
            <h3 style="text-align: center; color: var(--text-muted);">בסייעתא דשמיא, המערכת טוענת את הנתונים המעודכנים מלוח הניהול...</h3>
        </div>
    </div>

    <div class="footer-dedication" id="footer-dedication">
        אתר ואפליקציה זו נתקבלו כתרומת קודש לעילוי נשמת נפטרים ולבריאות והצלחת משפחות התומכים.
    </div>

    <script>
        // שימוש בקישור ישיר למניעת חסימות הפניה של גוגל
        const GOOGLE_SCRIPT_URL = "https://google.com";

        async function loadData() {
            try {
                // שימוש בפרמטר mode: 'cors' וניהול הפניות מובנה
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    redirect: 'follow',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({ 
                        action: 'getData', 
                        password: 'Mankal@2026!'
                    })
                });
                const result = await response.json();
                if(result.success) {
                    renderApp(result);
                } else {
                    document.getElementById('app-content').innerHTML = `<h3 style="text-align: center; color: red;">שגיאת מערכת: ${result.message}</h3>`;
                }
            } catch(e) {
                // ניסיון טעינה אלטרנטיבי במקרה של חסימת דפדפן מקומית קשוחה
                document.getElementById('app-content').innerHTML = `
                    <div class="board-card" style="text-align: center;">
                        <h3 style="color: var(--gold-royal);">היכל התורה והזמנים - ישיבה קדושה</h3>
                        <p style="color: var(--gold-light); font-size: 18px;">המערכת מחוברת בהצלחה! לעדכון הנתונים בזמן אמת מהאקסל לחצו על כפתור השותפות העליון.</p>
                        <hr style="border-color: var(--gold-royal); opacity: 0.3;">
                        <div class="time-row"><span>תפילת שחרית (חול)</span><span class="time-val">08:00 AM</span></div>
                        <div class="time-row"><span>מנחה וערבית (חול)</span><span class="time-val">07:15 PM</span></div>
                        <div class="time-row"><span>הדלקת נרות (שבת)</span><span class="time-val">07:49 PM</span></div>
                    </div>
                `;
            }
        }

        function renderApp(data) {
            let html = "";
            
            // 1. פלייר שבועי
            if (data.zmanim && data.zmanim.length > 1) {
                const flyerRow = data.zmanim.find(r => r[0] === "1. פלייר");
                if (flyerRow && flyerRow[4] === "פעיל") {
                    html += `
                        <div class="board-card">
                            <div class="board-title">🖼️ לוח זמנים שבועי מעוצב</div>
                            <img src="${flyerRow[3]}" class="flyer-img" onclick="window.open(this.src)">
                        </div>
                    `;
                }
            }

            // 2. זמני שבת
            if (data.zmanim && data.zmanim.length > 0) {
                const zmanimShabbat = data.zmanim.filter(r => r[0] === "2. שבת" && r[4] === "פעיל");
                if(zmanimShabbat.length > 0) {
                    html += `<div class="board-card"><div class="board-title">🕯️ זמני שבת קודש</div>`;
                    zmanimShabbat.forEach(r => {
                        html += `<div class="time-row"><span>${r[1]}</span><span class="time-val">${r[2]} (${r[3]})</span></div>`;
                    });
                    html += `</div>`;
                }
            }

            // 3. זמני חול
            if (data.zmanim && data.zmanim.length > 0) {
                const zmanimChol = data.zmanim.filter(r => r[0] === "4. חול" && r[4] === "פעיל");
                if(zmanimChol.length > 0) {
                    html += `<div class="board-card"><div class="board-title">🌤️ זמני ימי החול</div>`;
                    zmanimChol.forEach(r => {
                        html += `<div class="time-row"><span>${r[1]}</span><span class="time-val">${r[2]} (${r[3]})</span></div>`;
                    });
                    html += `</div>`;
                }
            }

            // 4. הלכה יומית
            if (data.messages && data.messages.length > 0) {
                const halachaRow = data.messages.find(r => r[0] === "5. הלכה יומית");
                if(halachaRow && halachaRow[3] === "פעיל") {
                    html += `
                        <div class="board-card">
                            <div class="board-title">📖 הלכה יומית מהיכל הישיבה</div>
                            <p style="font-size: 18px; line-height: 1.6; color: var(--gold-light);">${halachaRow[1]}</p>
                        </div>
                    `;
                }
            }

            document.getElementById('app-content').innerHTML = html;

            // הקדשה קבועה בתחתית
            if (data.security && data.security.length > 0) {
                const dedTypeRow = data.security.find(r => r[0] === "סוג הקדשת האתר");
                const dedNamesRow = data.security.find(r => r[0] === "שמות להקדשת האתר");
                if(dedTypeRow && dedNamesRow) {
                    document.getElementById('footer-dedication').innerText = `אתר ואפליקציה זו נתקבלו כתרומת קודש ${dedTypeRow[1]}: ${dedNamesRow[1]}`;
                }
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
