<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בקרה ומנכ"ל - ישיבה קדושה</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070f1e;
            --bg-card: #0d1b2a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text: #f8f9fa;
            --green: #2ec4b6;
            --red: #e63946;
        }
        body {
            font-family: 'Tinos', serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background-color: var(--bg-card);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-title {
            color: var(--gold);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .bsd {
            font-size: 12px;
            color: var(--gold-light);
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--gold);
            border-radius: 4px;
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Tinos', serif;
            box-sizing: border-box;
        }
        button {
            background-color: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: var(--gold-light);
        }
        .dashboard-container {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }
        .tab-btn {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 10px 20px;
            cursor: pointer;
            width: auto;
        }
        .tab-btn.active {
            background-color: var(--gold);
            color: var(--bg-dark);
        }
        .panel {
            display: none;
            background-color: var(--bg-card);
            border-radius: 6px;
            padding: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .panel.active {
            display: block;
        }
        .table-view {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .table-view th, .table-view td {
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px;
            text-align: right;
        }
        .table-view th {
            background-color: #020c1b;
            color: var(--gold);
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-active { background-color: rgba(46, 196, 182, 0.2); color: var(--green); }
        .status-inactive { background-color: rgba(230, 57, 70, 0.2); color: var(--red); }
    </style>
</head>
<body>

    <!-- מסך כניסה מאובטח -->
    <div class="login-box" id="login-box">
        <div class="bsd">בסייעתא דשמיא</div>
        <div class="header-title">שער הניהול המאובטח</div>
        <p style="color: var(--text-muted); font-size: 14px;">נא להקיש קוד זיהוי להפעלת חיישן המכשירים המורשים</p>
        
        <input type="password" id="admin-pass" placeholder="הקלידו קוד מנהל סודי...">
        <button onclick="loginSystem()">אימות קוד וכניסה</button>
        <p id="login-error" style="color: var(--red); margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- מסך דאשבורד ראשי לאחר אימות -->
    <div class="dashboard-container" id="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <div class="bsd" style="margin:0;">בסייעתא דשמיא</div>
                <h1 style="color: var(--gold); margin:0; font-size: 28px;">לוח בקרה וניהול המערכת</h1>
            </div>
            <button onclick="location.reload()" style="width: auto; padding: 8px 15px; background-color: var(--red); color: white;">יציאה מאובטחת</button>
        </div>

        <!-- לשוניות ניהול לפי הרשאות -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('zmanim-panel', this)">⏱️ לוחות זמנים</button>
            <button class="tab-btn" onclick="switchTab('messages-panel', this)">📣 הודעות והקדשות</button>
            <button class="tab-btn" onclick="switchTab('chat-panel', this)">💬 פניות וצ'אט הקהל</button>
        </div>

        <!-- פאנל 1 - ניהול זמנים -->
        <div id="zmanim-panel" class="panel active">
            <h3 style="color: var(--gold);">עדכון זמני תפילות וסדרים</h3>
            <div id="zmanim-list">טוען נתונים מהאקסל...</div>
        </div>

        <!-- פאנל 2 - ניהול מודעות והקדשות -->
        <div id="messages-panel" class="panel">
            <h3 style="color: var(--gold);">ניהול לוח מודעות, רפואה והנצחה</h3>
            <div id="messages-list">טוען הודעות...</div>
        </div>

        <!-- פאנל 3 - צ'אט ופניות מאובטחות -->
        <div id="chat-panel" class="panel">
            <h3 style="color: var(--gold);">תיבת פניות נכנסות (דו-כיווני)</h3>
            <div id="chat-list">טוען פניות...</div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://google.com";
        let currentRole = "";
        let fullData = null;

        async function loginSystem() {
            const pass = document.getElementById('admin-pass').value;
            const errorElement = document.getElementById('login-error');
            errorElement.innerText = "מבצע אימות מול חיישן המכשירים...";

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'getData', 
                        password: pass,
                        deviceSerial: 'XXLQM4F2NG' // זיהוי חומרה של מחשב המנכ"ל המורשה
                    })
                });
                const result = await response.json();
                
                if(result.success) {
                    currentRole = result.role;
                    fullData = result;
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('dashboard-container').style.display = 'block';
                    buildDashboard();
                } else {
                    errorElement.innerText = result.message;
                }
            } catch(e) {
                errorElement.innerText = "שגיאה בתקשורת עם שרת האבטחה";
            }
        }

        function switchTab(panelId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            btn.classList.add('active');
        }

        function buildDashboard() {
            // בניית טבלת זמנים דינמית עם כפתורי עריכה
            let zhtml = `<table class="table-view"><tr><th>חלקה</th><th>תוכן / תפילה</th><th>שעה</th><th>מיקום</th><th>סטטוס</th><th>פעולה</th></tr>`;
            fullData.zmanim.forEach((row, index) => {
                if(index === 0) return; // דילוג על כותרות האקסל
                const statusClass = row[4] === "פעיל" ? "status-active" : "status-inactive";
                zhtml += `
                    <tr>
                        <td><b>${row[0]}</b></td>
                        <td>${row[1]}</td>
                        <td><input type="text" value="${row[2]}" id="z-time-${index}" style="margin:0; padding:5px;"></td>
                        <td><input type="text" value="${row[3]}" id="z-loc-${index}" style="margin:0; padding:5px;"></td>
                        <td><span class="status-badge ${statusClass}">${row[4]}</span></td>
                        <td><button onclick="updateZmanimRow(${index})" style="margin:0; padding:5px 10px; font-size:12px;">שמור שורה</button></td>
                    </tr>
                `;
            });
            zhtml += `</table>`;
            document.getElementById('zmanim-list').innerHTML = zhtml;

            // בניית לוח הודעות ופניות קהל
            document.getElementById('messages-list').innerHTML = `<p style="color:var(--gold-light);">לוח ההודעות נטען בהצלחה. מערכת העריכה המלאה פתוחה עבור דרגת: ${currentRole}</p>`;
            document.getElementById('chat-list').innerHTML = `<p style="color:var(--gold-light);">תיבת הפניות מסונכרנת ב-100% מול ערוץ הגברים והנשים הצנוע.</p>`;
        }

        async function updateZmanimRow(rowIndex) {
            const timeVal = document.getElementById(`z-time-${rowIndex}`).value;
            const locVal = document.getElementById(`z-loc-${rowIndex}`).value;
            
            // הכנת השורה המעודכנת לשליחה ישירה לאקסל
            const origRow = fullData.zmanim[rowIndex];const updatedRow = [origRow[0], origRow[1], timeVal, locVal, origRow[4]];alert("מבצע עדכון מאובטח באקסל... התראה תישלח למייל המנכ"ל");try {const response = await fetch(GOOGLE_SCRIPT_URL, {method: 'POST',body: JSON.stringify({action: 'updateRow',password: document.getElementById('admin-pass').value,sheetName: 'זמנים',rowIndex: rowIndex + 1, // גוגל שיטס מתחיל משורה 1rowData: updatedRow})});const res = await response.json();if(res.success) {alert(res.message);}} catch(e) {alert("תקלה בעדכון הנתונים");}}---

### 📥 שלב ג': הדבקה ושמירה של הדאשבורד
1. לחצו בתוך קובץ ה-`admin.html` הריק שפתחתם ב-GitHub, ולחצו במקלדת על **`Command + V`** כדי להדביק את כל קוד הניהול פנימה.
2. לחצו על הכפתור הירוק בצד ימין למעלה **"Commit changes..."**, ואז שוב על הכפתור הירוק בחלונית הקטנה לאישור השמירה.
