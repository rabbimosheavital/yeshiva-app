<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הישיבה הקדושה - היכל התורה והזמנים</title>
    <!-- פונטים יוקרתיים וסמלים לאפליקציה מפוארת -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-royal-dark: #030a16;
            --bg-panel: #0b1a30;
            --bg-card: #112542;
            --gold-royal: #d4af37;
            --gold-light: #f6e6b4;
            --gold-gradient: linear-gradient(135deg, #b38728, #fbf5b7, #daa520, #f6e6b4, #aa771c);
            --text-light: #f8f9fa;
            --text-muted: #a8b2d1;
            --royal-blue: #1c3d6c;
            --green-glow: #2ec4b6;
            --border-royal: 1px solid rgba(212, 175, 55, 0.4);
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-royal-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at 50% 15%, #0d2347 0%, var(--bg-royal-dark) 70%);
        }

        /* כותרת קודש מלכותית עליונה */
        .holy-header {
            background: linear-gradient(180deg, #01050e 0%, rgba(11,26,48,0.9) 100%);
            border-bottom: 3px solid transparent;
            border-image: var(--gold-gradient) 1;
            text-align: center;
            padding: 25px 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.6);
        }

        .bsd {
            font-family: 'Tinos', serif;
            font-size: 15px;
            color: var(--gold-light);
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .pasuk {
            font-family: 'Tinos', serif;
            font-size: 24px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            margin: 0;
            letter-spacing: 1px;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* סרגל כלים יוקרתי */
        .system-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 37, 66, 0.7);
            border: var(--border-royal);
            padding: 12px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .lang-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .lang-btn.active, .lang-btn:hover {
            border-color: var(--gold-royal);
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-light);
        }

        .action-btn {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(212,175,55,0.3);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212,175,55,0.5);
        }

        /* כרטיסיות ואגפים מעוצבים כהיכל */
        .board-card {
            background-color: var(--bg-panel);
            border: var(--border-royal);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        .board-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--gold-gradient);
        }

        .board-title {
            font-family: 'Tinos', serif;
            color: var(--gold-royal);
            font-size: 24px;
            font-weight: 700;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .board-title i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* עיצוב טבלאות וזמנים מרהיב */
        .time-table {
            width: 100%;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 10px;
            border-bottom: 1px solid rgba(168, 178, 209, 0.08);
            transition: background 0.2s ease;
        }

        .time-row:hover {
            background: rgba(255,255,255,0.02);
        }

        .time-row:last-child {
            border-bottom: none;
        }

        .time-name {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-val {
            font-family: 'Tinos', serif;
            color: var(--gold-light);
            font-size: 19px;
            font-weight: 700;
            background: rgba(212, 175, 55, 0.05);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        /* נגן וידאו חסידי יוקרתי */
        .video-container {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: var(--border-royal);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        /* סגנון טפסים וצ'אט */
        .form-group {
            margin-bottom: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            background-color: rgba(3, 10, 22, 0.6);
            color: white;
            font-family: 'Assistant', sans-serif;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--gold-royal);
            box-shadow: 0 0 10px rgba(212,175,55,0.2);
        }

        .submit-btn {
            background: linear-gradient(135deg, #2ec4b6, #209c90);
            color: #030a16;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46,196,182,0.2);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(46,196,182,0.4);
        }

        /* קיר הנצחה עם נר נשמה דולק חי */
        .memorial-wall {
            background: linear-gradient(135deg, #020710 0%, #0b1424 100%);
            border: 2px solid transparent;
            border-image: var(--gold-gradient) 1;
            padding: 30px;
            text-align: center;
            margin-top: 40px;
            position: relative;
        }

        .candle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .candle {
            width: 16px; height: 40px;
            background: linear-gradient(to right, #e6d39a, #f3e5ab, #d4af37);
            border-radius: 2px;
            position: relative;
        }

        .flame {
            width: 12px; height: 20px;
            background: radial-gradient(ellipse at bottom, #ffffff 0%, #f39c12 50%, #e67e22 100%);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -22px; left: 2px;
            animation: flicker 0.15s infinite alternate;
            box-shadow: 0 0 10px #f39c12;
        }

        @keyframes flicker {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.1); opacity: 1; transform: skewX(5deg); }
        }

        .memorial-title {
            font-family: 'Tinos', serif;
            color: var(--gold-royal);
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- היכל עליון מקודש -->
    <div class="holy-header">
        <div class="bsd">בסייעתא דשמיא</div>
        <div class="pasuk">לַה' הָאָרֶץ וּמְלוֹאָהּ תֵּבֵל וְיֹשְׁבֵי בָהּ</div>
    </div>

    <div class="container">
        
        <!-- סרגל כלים יוקרתי ושפות -->
        <div class="system-bar">
            <div>
                <button class="lang-btn active"><i class="fa-solid fa-flag"></i> עברית</button>
                <button class="lang-btn" onclick="alert('Translation module ready in core. Synced with Sheet.')">🇺🇸 English</button>
                <button class="lang-btn" onclick="alert('Módulo de traducción listo.')">🇪🇸 Español</button>
            </div>
